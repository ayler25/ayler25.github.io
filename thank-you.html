<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Yoga Relief with Ayla</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background: #f5f0e6;

      color: #304c44;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    .thank-you-card {

      width: 100%;

      max-width: 650px;

      padding: 55px 30px;

      background: #fffdf8;

      border-radius: 24px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);

    }

    h1 {

      margin: 0 0 20px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 2.4rem;

      font-weight: normal;

      color: #304c44;

    }

    p {

      margin: 8px 0;

      font-size: 1.1rem;

      line-height: 1.7;

      color: #4f5f59;

    }

    .return-button {

      display: inline-block;

      margin-top: 28px;

      padding: 14px 24px;

      border-radius: 999px;

      background: #304c44;

      color: white;

      text-decoration: none;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <main class="thank-you-card">

    <h1>Thank You!</h1>

    <p>Your message has been sent.</p>

    <p>I’ll be in touch soon.</p>

    <a class="return-button" href="https://yogareliefwithayla.com/">
